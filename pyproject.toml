[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dltop"
version = "0.1.1"
description = "top/htop-style GPU monitor for CV and AI workloads -- splits CUDA/Tensor/FP* compute from NVENC/NVDEC media engines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nikhil", email = "nikhil@detecttechnologies.com" }]
keywords = ["gpu", "monitoring", "nvidia", "cuda", "tui", "dcgm", "nvml", "computer-vision", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "loguru>=0.7",
    "nvidia-ml-py>=12.0",
    "psutil>=5.9",
    "rich>=13.0",
    "textual>=0.60",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
screenshots = ["cairosvg>=2.7"]

[project.scripts]
dltop = "dltop:main"

[tool.setuptools.packages.find]
include = ["dltop*"]

[tool.black]
line-length = 119

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "COM812",  # missing-trailing-comma (formatter handles)
    "PLR2004", # magic-value-comparison (too noisy for UI thresholds)
]

[tool.ruff.lint.per-file-ignores]
# Test files legitimately use pytest asserts, import the module late, poke
# private helpers, and shell out to the installed entry point. None of these
# patterns indicate a real problem in test code.
"tests/**" = [
    "S101",    # assert is how pytest works
    "S603",    # subprocess calls in tests are test-authored, not user input
    "S607",    # invoking the installed entry point `dltop` via PATH is the point
    "SLF001",  # testing `_clamp_pct` and other underscore-prefixed helpers
    "PLC0415", # late imports isolate import-triggering test cases
    "INP001",  # tests/ is a pytest test root, not a namespace package
    "D100",    # test modules don't need module docstrings
    "D103",    # test functions are self-documenting via their names
]
# Dev utilities (screenshot/demo tooling), not shipped in the package.
"scripts/**" = [
    "T201",    # print() is the script's user-facing output
    "INP001",  # scripts/ is not an importable package
    "SLF001",  # poking dltop internals (_refresh_cards, _collect_processes) is the point
    "ANN401",  # process dicts are heterogeneous
    "D103",    # local helpers are self-documenting
    "PLC0415", # cairosvg imported late so it stays an optional extra
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
